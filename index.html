<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Release Decision System</title>
		<link href="style.css" rel="stylesheet">
		<script src="scripts/main.js" type="module"></script>
	</head>
	<body>
		<h1>Release Decision System</h1>
		<section>
			<h2>Release Decision</h2>
			<p>Blocking tickets: <span id="count_RELEASE_BLOCKER">0</span></p>
			<p>Priority tickets: <span id="count_PRIORITY">0</span></p>
			<p>Unassigned tickets: <span id="count_UNASSIGNED"></span></p>
			<p>Work hours left: <span id="workHours"></span></p>
			<p>Release decision: <span id="decision"></span></p>
		</section>
		<section>
			<h2>Ticket List</h2>
			<label for="idSearch">Search for ID: <input type="text" id="idSearch"></label>
			<label for="filterStatus">Filter by status: 
				<select id="filterStatus">
					<option value="">All</option>
					<option value="RELEASE_BLOCKER">Release Blocker</option>
					<option value="PRIORITY">Priority</option>
					<option value="UNASSIGNED">Unassigned</option>
					<option value="ACTIVE">Active</option>
					<option value="DONE">Done</option>
				</select>
			</label>
			<label for="sortBy">Sort by: 
				<select id="sortBy">
					<option value="severity">Severity</option>
					<option value="id">ID</option>
					<option value="classification">Classification</option>
					<option value="hours">Remaining Hours</option>
				</select>
			</label>
			<button id="addTicket">Add Ticket</button>
			<div id="ticketList"></div>
		</section>
		<div class="modal hidden" id="ticketModal">
			<div class="modal-content">
				<span class="close" id="closeModal">&times;</span>
				<h2 id="ticketModalTitle">Edit Ticket</h2>
				<form id="ticketEdit">
					<label for="ticketId">Ticket ID: <input type="text" id="ticketId" readonly disabled size="4"></label>
					<label for="ticketTitle">Title: <input type="text" id="ticketTitle"></label>
					<label for="ticketSeverity">Severity: <input type="number" id="ticketSeverity" min="1" max="5"></label>
					<label for="ticketStatus">Status:
						<select id="ticketStatus">
							<option value="open">Open</option>
							<option value="testing">Testing</option>
							<option value="done">Done</option>
						</select>
					</label>
					<label for="ticketOwner">Owner: <input type="text" id="ticketOwner"></label>
					<label for="ticektHours">Remaining Hours: <input type="number" id="ticketHours" min="0" size="3"></label>
					<label for="ticketCustomerVip"><input type="checkbox" id="ticketCustomerVip"> VIP Customer</label>
					<label for="ticketBlocked"><input type="checkbox" id="ticketBlocked"> Blocked</label>
					<input id="ticketSave" type="submit" value="Save Changes">
					<p id="ticketError" class="error"></p>
				</form>
				<button id="ticketDelete">Delete Ticket</button>
			</div>
		</div>
	</body>
</html>
