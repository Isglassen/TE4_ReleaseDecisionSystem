<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Release Decision System</title>
		<link href="style.css" rel="stylesheet">
		<script src="scripts/main.js" type="module"></script>
	</head>
	<body>
		<h1>Release Decision System</h1>
		<section class="info">
			<h2>Release Decision</h2>
			<span>Blocking tickets: </span>
			<span class="right-text" id="count_RELEASE_BLOCKER">0</span>
			<span>Priority tickets: </span>
			<span class="right-text" id="count_PRIORITY">0</span>
			<span>Unassigned tickets: </span>
			<span class="right-text" id="count_UNASSIGNED"></span>
			<span>Work hours left: </span>
			<span class="right-text" id="workHours"></span>
			<span>Release decision: </span>
			<span class="right-text" id="decision"></span>
		</section>
		<div class="seperator"></div>
		<section class="grow">
			<h2>Ticket List</h2>
			<label for="idSearch">Search: <input type="text" id="idSearch"></label>
			<label for="filterStatus">Filter by status: 
				<select id="filterStatus">
					<option value="">All</option>
					<option value="RELEASE_BLOCKER">Release Blocker</option>
					<option value="PRIORITY">Priority</option>
					<option value="UNASSIGNED">Unassigned</option>
					<option value="ACTIVE">Active</option>
					<option value="DONE">Done</option>
				</select>
			</label>
			<label for="sortBy">Sort by: 
				<select id="sortBy">
					<option value="severity">Severity</option>
					<option value="id">ID</option>
					<option value="classification">Classification</option>
					<option value="hours">Remaining Hours</option>
				</select>
			</label>
			<button id="addTicket">Add Ticket</button>
			<div id="ticketList"></div>
		</section>
		<div class="modal hidden" id="ticketModal">
			<div class="modal-content">
				<span class="close" id="closeModal">&times;</span>
				<h2 id="ticketModalTitle">Edit Ticket</h2>
				<form id="ticketEdit">
					<label for="ticketId">Ticket ID: </label>
					<input type="text" id="ticketId" readonly disabled size="4">
					<label for="ticketTitle">Title: </label>
					<input type="text" id="ticketTitle">
					<label for="ticketSeverity">Severity: </label>
					<input type="number" id="ticketSeverity" min="1" max="5" size="3">
					<label for="ticketStatus">Status: </label>
					<select id="ticketStatus">
						<option value="open">Open</option>
						<option value="testing">Testing</option>
						<option value="done">Done</option>
					</select>
					<label for="ticketOwner">Owner: </label>
					<input type="text" id="ticketOwner">
					<label for="ticektHours">Remaining Hours: </label>
					<input type="number" id="ticketHours" min="0" size="5">
					<label for="ticketCustomerVip" class="span"><input type="checkbox" id="ticketCustomerVip"> VIP Customer</label>
					<label for="ticketBlocked" class="span"><input type="checkbox" id="ticketBlocked"> Blocked</label>
					<input id="ticketSave" type="submit" value="Save Changes" class="span">
					<p id="ticketError" class="error"></p>
				</form>
				<button id="ticketDelete">Delete Ticket</button>
			</div>
		</div>
	</body>
</html>
